---
- name: Install Python3 and pip
  package:
    name:
      - python3
      - python3-pip
    state: present

- name: Install Flask
  pip:
    name: flask

- name: Deploy Flask app
  template:
    src: app.py.j2
    dest: /opt/myapp/app.py
    mode: '0755'

- name: Create systemd service file
  template:
    src: myapp.service.j2
    dest: /etc/systemd/system/myapp.service
    mode: '0644'
  notify: Restart myapp
